<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>團購主月報表｜鬥陣買</title><link rel="stylesheet" href="admin/styles.css"><style>
body{padding:38px}.report-wrap{max-width:980px;margin:auto}.report-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px}.report-filter{display:flex;gap:10px}.report-filter select{padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}.report-title{margin:6px 0}.report-note{padding:16px 20px;background:#fff7df;border-radius:10px;color:#735d28;font-size:13px;margin-top:18px}.report-error{max-width:540px;margin:100px auto;text-align:center;background:#fff;padding:40px;border-radius:14px}.report-table{margin-top:20px}.summary-grid{grid-template-columns:repeat(4,1fr)}@media(max-width:700px){body{padding:20px 12px}.report-head{align-items:start;flex-direction:column}.summary-grid{grid-template-columns:1fr 1fr}}
</style></head><body><main id="report" class="report-wrap hidden"><header class="report-head"><div><p class="eyebrow">I BUY · YOU BUY · WE BUY</p><h1 class="report-title" id="campaignName">團購月報表</h1><p id="partnerName"></p></div><div class="report-filter"><select id="year"></select><select id="month"></select></div></header><section class="summary-grid"><article class="summary-card"><span>折扣碼使用次數</span><strong id="uses">0</strong></article><article class="summary-card"><span>已付款訂單</span><strong id="paid">0</strong></article><article class="summary-card"><span>實收商品金額</span><strong id="revenue">NT$ 0</strong></article><article class="summary-card"><span>預估佣金</span><strong id="commission">NT$ 0</strong></article></section><section class="panel report-table"><div class="panel-heading"><div><h2>月份彙總</h2><p>取消及退款訂單不列入佣金。</p></div></div><div class="table-wrap"><table><thead><tr><th>訂單狀態</th><th>筆數</th><th>商品金額</th><th>折扣金額</th><th>實收商品金額</th></tr></thead><tbody id="rows"></tbody></table></div></section><p id="localNote" class="report-note hidden">目前是本地預覽，尚未連接正式訂單，因此數字會顯示 0。連接官網訂單與資料庫後會自動產生實際月報。</p></main><section id="error" class="report-error hidden"><h1>無法查看報表</h1><p>這個報表連結不存在或已停用，請聯絡店家取得新連結。</p></section><script src="admin/config.js"></script><script src="partner-report.js"></script></body></html>
