name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run repository checks
        run: |
          set -e
          for test in tests/*.cjs tests/*.mjs; do node "$test"; done
          for file in netlify/functions/*.js admin/app.js; do node --check "$file"; done
