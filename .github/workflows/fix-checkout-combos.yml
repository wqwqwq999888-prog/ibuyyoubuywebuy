name: Verify checkout and ECPay integrations

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run repository checks
        shell: bash
        run: |
          set -e
          for test in tests/*.cjs; do node "$test"; done
          for test in tests/*.mjs; do node "$test"; done
          for file in netlify/functions/*.js admin/app.js; do node --check "$file"; done
          git diff --check
